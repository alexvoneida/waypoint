services:
  db:
    build:
      context: .
      dockerfile: db/Dockerfile
    image: waypoint-postgis:16
    container_name: waypoint-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-waypoint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waypoint}
      POSTGRES_DB: ${POSTGRES_DB:-waypoint}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-waypoint} -d ${POSTGRES_DB:-waypoint}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
